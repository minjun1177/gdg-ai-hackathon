<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BugReel — Report a Bug with Video</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131b2e;
      --border: #26324d;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 680px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 2rem;
      text-align: center;
    }
    h1 {
      font-size: 2.5rem;
      margin: 0 0 0.5rem;
      letter-spacing: -0.02em;
    }
    .tagline {
      color: var(--muted);
      font-size: 1.2rem;
      margin: 0;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      font-size: 1.05rem;
    }
    .field {
      margin-bottom: 1.5rem;
    }
    input[type="text"],
    input[type="url"],
    input[type="file"],
    textarea {
      width: 100%;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #090d16;
      color: var(--text);
      font-size: 1rem;
    }
    video {
      width: 100%;
      max-height: 320px;
      border-radius: 8px;
      margin-top: 0.75rem;
      background: #000;
      display: none;
    }
    button {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .error {
      color: #f87171;
      margin-top: 1rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>BugReel</h1>
      <p class="tagline">Reporters send a video. Developers just approve.</p>
      <p style="margin-top: 0.6rem; font-size: 0.95rem; display: flex; justify-content: center; gap: 1.25rem; flex-wrap: wrap;">
        <a href="/architecture.html" style="color: #60a5fa; text-decoration: none; font-weight: 600;">Interactive Architecture Diagram &rarr;</a>
        <a href="/review/6f680035" style="color: #4ade80; text-decoration: none; font-weight: 600;">Verified Demo Run (#6f680035 &rarr; PR #1) &rarr;</a>
      </p>
    </header>

    <form id="reportForm" class="card">
      <div class="field">
        <label for="videoInput">1. Screen Recording (MP4 / WebM / MOV)</label>
        <input id="videoInput" name="video" type="file" accept="video/mp4,video/webm,video/quicktime" required />
        <video id="videoPreview" controls muted></video>
      </div>

      <div class="field">
        <label for="noteInput">2. One-line Note</label>
        <input id="noteInput" name="note" type="text" placeholder="체크했는데 숫자가 그대로예요 (I checked it but the number didn't change)" value="체크했는데 숫자가 그대로예요" />
      </div>

      <div class="field">
        <label for="repoInput">3. Target Repository URL</label>
        <input id="repoInput" name="repoUrl" type="url" placeholder="https://github.com/minjun1177/bugreel-demo-todo" value="https://github.com/minjun1177/bugreel-demo-todo" required />
      </div>

      <button id="submitBtn" type="submit">Submit Bug Video &rarr;</button>
      <div id="errorBox" class="error"></div>
    </form>
  </div>

  <script>
    const videoInput = document.getElementById("videoInput");
    const videoPreview = document.getElementById("videoPreview");
    const form = document.getElementById("reportForm");
    const submitBtn = document.getElementById("submitBtn");
    const errorBox = document.getElementById("errorBox");
    let currentPreviewUrl = null;

    videoInput.addEventListener("change", () => {
      if (currentPreviewUrl) {
        URL.revokeObjectURL(currentPreviewUrl);
        currentPreviewUrl = null;
      }
      const file = videoInput.files[0];
      if (file) {
        currentPreviewUrl = URL.createObjectURL(file);
        videoPreview.src = currentPreviewUrl;
        videoPreview.style.display = "block";
      } else {
        videoPreview.removeAttribute("src");
        videoPreview.style.display = "none";
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Uploading...";

      try {
        const formData = new FormData(form);
        const res = await fetch("/api/reports", {
          method: "POST",
          body: formData,
        });
        const text = await res.text();
        let data = {};
        try {
          data = JSON.parse(text);
        } catch {
          data = { error: text || `Server error (${res.status})` };
        }
        if (!res.ok) throw new Error(data.error || "Upload failed");
        window.location.href = `/review/${data.id}`;
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Bug Video →";
      }
    });
  </script>
</body>
</html>
