<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BugReel — Developer Review</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131b2e;
      --border: #26324d;
      --text: #f8fafc;
      --muted: #94a3b8;
      --red: #ef4444;
      --green: #22c55e;
      --blue: #3b82f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 2rem;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { margin-top: 0; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    pre {
      background: #090d16;
      padding: 1rem;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>BugReel — Developer Review</h1>
    <div class="card">
      <strong>Stage:</strong> <span id="stageText">Loading...</span>
    </div>
    <div class="card">
      <strong>Report JSON:</strong>
      <pre id="reportJson">Loading report...</pre>
    </div>
  </div>
  <script>
    const reportId = window.location.pathname.split("/").filter(Boolean).pop();
    const stageText = document.getElementById("stageText");
    const reportJson = document.getElementById("reportJson");
    const TERMINAL_STAGES = new Set([
      "not_reproduced",
      "fixed",
      "fix_failed",
      "pr_opened",
      "error",
    ]);

    let pollTimer = null;
    let es = null;

    function renderReport(data) {
      if (!data) return;
      stageText.textContent = data.stage || "unknown";
      reportJson.textContent = JSON.stringify(data, null, 2);
      if (TERMINAL_STAGES.has(data.stage)) {
        if (es) {
          es.close();
          es = null;
        }
        if (pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
        }
      }
    }

    async function fetchReport() {
      try {
        const res = await fetch(`/api/reports/${reportId}`);
        if (!res.ok) {
          stageText.textContent = `Not found (${res.status})`;
          return;
        }
        const data = await res.json();
        renderReport(data);
      } catch (err) {
        stageText.textContent = `Connection error: ${err.message}`;
      }
    }

    function startPollingFallback() {
      if (!pollTimer) {
        pollTimer = setInterval(fetchReport, 2000);
      }
    }

    fetchReport();
    startPollingFallback();

    if (window.EventSource) {
      es = new EventSource(`/api/reports/${reportId}/events`);
      es.onmessage = (evt) => {
        try {
          const event = JSON.parse(evt.data);
          if (event.type === "result" && event.report) {
            renderReport(event.report);
          } else {
            fetchReport();
          }
        } catch {
          fetchReport();
        }
      };
      es.onerror = () => {
        startPollingFallback();
      };
    }
  </script>
</body>
</html>
